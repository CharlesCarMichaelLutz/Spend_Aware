# Postgres database      
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spend_aware"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spend_aware
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
      
# Mailpit Email client  
  mailpit:
    image: axllent/mailpit:latest
    container_name: app-mailpit
    ports:
      - "1025:1025" 
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
        MP_DATABASE: /data/mailpit.db
    networks:
      - app-network
      
# PgAdmin DB interface  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4-container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin12345
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres-data:
  mailpit_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
        


